services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blog123456}
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动自动按文件名顺序执行 schema.sql → data.sql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-blog123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped

  server:
    build: ./blog-server
    container_name: blog-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blog123456}
      REDIS_HOST: redis
      UPLOAD_DIR: /app/upload
      TZ: Asia/Shanghai
    volumes:
      - ./data/upload:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./blog-front/dist:/usr/share/nginx/front:ro
      - ./blog-admin/dist:/usr/share/nginx/admin:ro
      - ./data/upload:/usr/share/nginx/upload
    depends_on:
      - server
