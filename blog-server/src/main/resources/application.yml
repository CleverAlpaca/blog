server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800        # token 有效期 7 天（秒）
  active-timeout: -1     # 不启用无操作冻结
  is-concurrent: true
  token-style: uuid
  is-log: false
  is-print: false

blog:
  site-name: Alpaca's Blog
  # 前台访问地址：RSS 订阅链接基于它生成；生产环境在 application-prod.yml 用环境变量覆盖
  site-url: http://localhost:5173
  upload-dir: ./upload
  storage:
    type: local    # local 本地磁盘 / oss 阿里云 OSS（endpoint 指向 MinIO 等自建服务亦可）
    # oss:
    #   endpoint: oss-cn-hangzhou.aliyuncs.com
    #   access-key-id: your-ak
    #   access-key-secret: your-sk
    #   bucket: your-bucket
    #   host: https://cdn.example.com   # 可选：自定义图片访问域名（CDN）
